server:
  port: ${API_PUBLIC_PORT:8082}

spring:
  application:
    name: sicat-public-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:sicat}?currentSchema=publico
    username: ${SICAT_PUBLIC_DB_USER:sicat_public_ro}   # solo SELECT sobre las vistas de publico
    password: ${SICAT_PUBLIC_DB_PASSWORD:cambiar-public}
    hikari:
      read-only: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false                # NUNCA ejecuta migraciones
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=5000,expireAfterWrite=5m

sicat:
  cors:
    origenes: ${SICAT_PUBLIC_CORS:http://localhost:4300}
  rate-limit:
    pedidos-por-minuto: 120

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
